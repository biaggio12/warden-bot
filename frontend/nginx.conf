server {
    listen 80;
    root /usr/share/nginx/html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The page always asks for the latest build (the hashed assets above never change).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
