name: Deploy

# Runs after CI succeeds on a push to main, or by hand from the Actions tab.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer one waits instead of cancelling a deploy half way through.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://warden.23-88-19-218.sslip.io
    env:
      # The commit CI tested, not whatever main points at by now.
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy ${{ env.SHA }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        # The fast-forward happens before the script runs, so the server always runs this commit's deploy.sh.
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -e; cd '$DEPLOY_PATH' && git fetch --quiet origin main && git merge --ff-only $SHA && scripts/deploy.sh $SHA"

      - name: Health check
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors \
            https://warden.23-88-19-218.sslip.io/api/v1/health
