[www]
listen = 9000
pm.status_path = /status
ping.path = /ping
ping.response = pong
clear_env = no
access.suppress_path[] = /ping
access.suppress_path[] = /status

; The default 5 workers queue a rush of Discord clicks (each [Killed] is 2 API calls).
; About 40 MB each at most; Postgres allows 100 connections.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
